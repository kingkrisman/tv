<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080A" />
    <meta name="description" content="Daniels Network — thousands of free live TV channels from around the world, in one quiet place." />
    <title>Daniels Network</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="preload" href="/api/channels" as="fetch" crossorigin />
    <script>
      try {
        var t = localStorage.getItem("dn-theme");
        if (t === "light") document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
